
<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELITE MOTORS | عالم السيارات</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0d;color:white;font-family:Arial,sans-serif}
header{background:#151518;padding:22px 14px;text-align:center;border-bottom:2px solid #c9a34a}
header h1{color:#d9b45b;letter-spacing:2px;margin:0 0 8px}
header p{color:#ccc;margin:0}
nav{padding:16px;text-align:center}
nav a{color:#e5c36d;text-decoration:none;margin:8px}
.hero{text-align:center;padding:35px 15px;background:linear-gradient(135deg,#252525,#090909)}
.hero h2{font-size:30px;color:#e7c66f}
.hero p{color:#ddd}
input,select{padding:13px;border-radius:8px;border:1px solid #777;background:#1b1b1f;color:white;width:100%;max-width:500px;margin:8px auto;display:block}
main{padding:18px;max-width:1100px;margin:auto}
.cars{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.card{background:#19191d;border:1px solid #393939;border-radius:12px;overflow:hidden;box-shadow:0 5px 18px #000}
.card img{width:100%;height:170px;object-fit:cover;background:#292929}
.info{padding:15px}
.info h3{color:#e7c66f;margin:4px 0 10px}
.price{color:#77df9a;font-size:20px;font-weight:bold}
.info p{color:#ddd}
.info button,.contact button{background:#c9a34a;color:#111;border:0;border-radius:7px;padding:11px 15px;font-weight:bold;cursor:pointer}
footer{text-align:center;padding:25px;background:#151518;color:#ccc;margin-top:30px}
</style>
</head>
<body>
<header>
<h1>ELITE MOTORS</h1>
<p>الفخامة تبدأ من هنا — عالم السيارات الرياضية</p>
</header>
<nav>
<a href="#cars">السيارات</a>
<a href="#contact">اتصل بنا</a>
</nav>
<section class="hero">
<h2>اكتشف سيارتك القادمة</h2>
<p>سيارات رياضية وفاخرة لعشّاق التميّز</p>
<input id="search" type="search" placeholder="🔎 ابحث عن سيارة بالاسم..." oninput="filterCars()">
<select id="brand" onchange="filterCars()">
<option value="">كل الماركات</option>
<option>BMW</option><option>Mercedes</option><option>Audi</option>
<option>Porsche</option><option>Lamborghini</option><option>Ferrari</option>
<option>Toyota</option><option>Ford</option>
</select>
</section>
<main id="cars">
<h2 style="color:#e7c66f;text-align:center">سياراتنا المميّزة</h2>
<div class="cars" id="carList"></div>
<p id="empty" style="display:none;text-align:center">ما لقيناش سيارة بالاسم هذا.</p>
</main>
<section id="contact" class="contact" style="text-align:center;padding:25px">
<h2 style="color:#e7c66f">اتصل بنا</h2>
<p>للاستفسار على السيارات والأسعار</p>
<p>الهاتف: أضف رقم هاتفك هنا</p>
</section>
<footer>© 2026 ELITE MOTORS — جميع الحقوق محفوظة</footer>
<script>
const cars=[
{name:"BMW M4",brand:"BMW",price:"ابتداءً من 180,000 د.ت",color:"#263f59",model:"BMW M4 رياضية"},
{name:"BMW M5",brand:"BMW",price:"ابتداءً من 250,000 د.ت",color:"#353535",model:"BMW M5 فاخرة"},
{name:"Mercedes AMG GT",brand:"Mercedes",price:"حسب النسخة",color:"#4b2930",model:"Mercedes AMG GT"},
{name:"Mercedes G-Class",brand:"Mercedes",price:"حسب النسخة",color:"#47513d",model:"Mercedes G-Class"},
{name:"Audi R8",brand:"Audi",price:"حسب النسخة",color:"#38434b",model:"Audi R8"},
{name:"Porsche 911",brand:"Porsche",price:"حسب النسخة",color:"#8a3434",model:"Porsche 911"},
{name:"Lamborghini Huracan",brand:"Lamborghini",price:"حسب النسخة",color:"#8c7b22",model:"Lamborghini Huracan"},
{name:"Ferrari 488",brand:"Ferrari",price:"حسب النسخة",color:"#a62828",model:"Ferrari 488"},
{name:"Toyota Supra",brand:"Toyota",price:"حسب النسخة",color:"#315c76",model:"Toyota Supra"},
{name:"Toyota Land Cruiser",brand:"Toyota",price:"حسب النسخة",color:"#55534b",model:"Toyota Land Cruiser"},
{name:"Ford Mustang",brand:"Ford",price:"حسب النسخة",color:"#5e2929",model:"Ford Mustang"},
{name:"Porsche Cayenne",brand:"Porsche",price:"حسب النسخة",color:"#344d3a",model:"Porsche Cayenne"}
];
const list=document.getElementById("carList");
list.innerHTML=cars.map((c,i)=>`
<article class="card" data-name="${c.name.toLowerCase()}" data-brand="${c.brand}">
<div style="height:170px;background:linear-gradient(145deg,${c.color},#111);display:flex;align-items:center;justify-content:center">
<svg viewBox="0 0 320 140" role="img" aria-label="${c.name}" style="width:95%;max-height:150px">
<path d="M35 91 L52 65 Q58 59 91 57 L120 30 Q128 23 149 23 L205 27 Q221 29 240 57 L268 66 L287 83 L287 103 L29 103 L29 91Z" fill="${c.color}" stroke="#ddd" stroke-width="2"/>
<path d="M126 34 L146 31 L170 32 L170 55 L108 55Z" fill="#9cb8c8"/>
<path d="M179 32 L204 35 Q218 40 231 55 L179 55Z" fill="#9cb8c8"/>
<circle cx="82" cy="101" r="20" fill="#080808" stroke="#aaa" stroke-width="4"/><circle cx="82" cy="101" r="8" fill="#bbb"/>
<circle cx="240" cy="101" r="20" fill="#080808" stroke="#aaa" stroke-width="4"/><circle cx="240" cy="101" r="8" fill="#bbb"/>
<path d="M34 83 L51 81 M269 78 L285 82" stroke="#f6dca0" stroke-width="5"/>
</svg>
</div>
<div class="info">
<h3>${c.name}</h3>
<p>${c.model}</p>
<p class="price">${c.price}</p>
<button onclick="askAbout('${c.name}')">اكتشف المزيد</button>
</div>
</article>`).join("");
function filterCars(){
const q=document.getElementById("search").value.toLowerCase().trim();
const brand=document.getElementById("brand").value;
let count=0;
document.querySelectorAll(".card").forEach(card=>{
const ok=card.dataset.name.includes(q)&&(!brand||card.dataset.brand===brand);
card.style.display=ok?"block":"none";
if(ok)count++;
});
document.getElementById("empty").style.display=count?"none":"block";
}
function askAbout(name){
alert("اخترت "+name+"\nاتصل بنا للاستفسار عن المواصفات والسعر.");
}
</script>
</body>
</html>
